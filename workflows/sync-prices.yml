name: sync-prices
on:
  schedule:
    - cron: '0 1 * * *' # 每天 09:00（北京时间）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync prices
        run: node tools/sync-prices.mjs --apply
      - name: Commit if changed
        run: |
          git config user.name "modelpick-price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/js/data/prices.js assets/js/data/prices.json
          git diff --cached --quiet || git commit -m "chore: sync model prices"
          git push
